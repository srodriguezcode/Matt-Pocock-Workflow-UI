name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/srodriguezcode/matt-pocock-workflow-ui

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: uaw-smoke:latest

      - name: Smoke test
        run: |
          docker run -d --name uaw-smoke -p 4200:4200 uaw-smoke:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4200/ >/dev/null; then
              echo "board answered"
              exit 0
            fi
            sleep 2
          done
          docker logs uaw-smoke
          echo "board did not answer" >&2
          exit 1

      - name: Image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="${IMAGE}:${version}"
          if [[ "$version" != *-* ]]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
