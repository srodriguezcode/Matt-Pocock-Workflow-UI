@let m = i18n.messages().board.rail.tile;
@if (!useImage()) {
  <label>
    {{ m.lettersLabel }}
    <input type="text" [value]="letters()" (input)="onLetters($event)" maxlength="2" required />
  </label>
}
<label class="check">
  <input type="checkbox" [checked]="useImage()" (change)="onUseImage($event)" />
  {{ m.useImageLabel }}
</label>
@if (useImage()) {
  <label>
    {{ m.imageLabel }}
    <input type="file" accept="image/*" (change)="onImage($event)" />
  </label>
  @if (image(); as src) {
    <img class="preview" [src]="src" alt="" />
  }
}
