@let m = i18n.messages().board.session.form.delivery;
<button
  type="button"
  [class.on]="delivery() === 'typed'"
  [attr.aria-pressed]="delivery() === 'typed'"
  [attr.aria-label]="m.label"
  [title]="m.tips[delivery()]"
  (click)="flip()"
>
  @if (delivery() === 'typed') {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="7" r="4" />
      <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2v3" />
      <circle cx="12" cy="2" r="1" />
      <rect x="4" y="5" width="16" height="13" rx="3" />
      <circle cx="9" cy="11" r="1.6" class="fill" />
      <circle cx="15" cy="11" r="1.6" class="fill" />
      <path d="M9 15h6M2 10v4M22 10v4" />
    </svg>
  }
</button>
