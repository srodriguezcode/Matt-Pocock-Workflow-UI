@if (option(); as o) {
  <button
    type="button"
    class="new-session"
    [class.wide]="place() === 'empty'"
    [attr.aria-disabled]="!o.enabled"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="i18n.messages().board.layout.menu.newSession"
    [title]="tooltip()"
    (click)="toggle()"
  >
    <svg
      width="15"
      height="15"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" />
      <path d="M8 5.2v3.6M6.2 7h3.6" />
    </svg>
    <span class="label">{{ i18n.messages().board.layout.menu.newSession }}</span>
  </button>
}
